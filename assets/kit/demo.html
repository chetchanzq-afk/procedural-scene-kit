<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procedural Scene Kit — demo reel</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #05070a;
    --bone: #eef3f7;
    --dim: rgba(238,243,247,.55);
    --sans: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; }
  body { font-family: var(--sans); color: var(--bone); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .lower { position: fixed; left: 56px; bottom: 52px; pointer-events: none; }
  /* 底部压暗，保证字幕在任何画面上都可读 */
  .scrim {
    position: fixed; left: 0; right: 0; bottom: 0; height: 260px; pointer-events: none;
    background: linear-gradient(0deg, rgba(5,7,10,.82) 0%, rgba(5,7,10,.45) 42%, rgba(5,7,10,0) 100%);
  }
  .brand {
    font: 600 11px/1 var(--mono); letter-spacing: .34em; text-transform: uppercase;
    color: rgba(238,243,247,.5); margin-bottom: 12px;
  }
  #shot-title {
    font: 600 30px/1.15 var(--sans); letter-spacing: -.01em;
    opacity: 0; transition: opacity .2s ease;
  }

  #stat {
    position: fixed; right: 56px; bottom: 56px; text-align: right; pointer-events: none;
    font: 500 11px/1.7 var(--mono); letter-spacing: .16em; color: var(--dim);
  }

  #fade { position: fixed; inset: 0; background: var(--ink); opacity: 1; pointer-events: none; }

  #fatal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px;
    background: rgba(40,8,4,.9); color: #ffb4a8; font: 12px/1.5 var(--mono);
    white-space: pre-wrap; max-height: 42%; overflow: auto; display: none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="scrim"></div>
<div class="lower">
  <div class="brand" id="brand">Procedural Scene Kit</div>
  <div id="shot-title">Rainy night · port</div>
</div>
<div id="stat"></div>

<div id="fade"></div>
<div id="fatal"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/demo.js"></script>
</body>
</html>
